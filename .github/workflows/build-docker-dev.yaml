name: Build and Push Docker Image dev 

on:
  workflow_dispatch: {}
  push:
    branches:
      - "main"

jobs:
  build:
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: "main"
          
      - name: Log in to Nexus Artifact Repository
        uses: docker/login-action@v2
        with:
          registry: cr.haust.app
          username: ${{ secrets.NEXUS_USER}}
          password: ${{ secrets.NEXUS_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Convert repository owner and name to lowercase
        id: vars
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set current date
        id: date
        run: echo "DATE=dev-$(TZ='Europe/Warsaw' date +%Y-%m-%d-%Hh%Mm)" >> $GITHUB_ENV

      - name: Mint token for private dependencies
        id: deps-token
        uses: actions/create-github-app-token@v3
        with:
          # haust-ci-bot; read-only access to the private smart-order-router fork used by the Dockerfile
          client-id: Iv23lipOnRLr9kmJtlhH
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: Haust-Labs
          repositories: haust-dex-smart-order-router
          permission-contents: read

      - name: Build Docker image
        run: |
         docker build --build-arg GITHUB_TOKEN=x-access-token:${{ steps.deps-token.outputs.token }} -t cr.haust.app/dex/dex:${{ env.DATE }} .

      - name: Push Docker image to GHCR
        run: |
          docker push cr.haust.app/dex/dex:${{ env.DATE }}
            
      - name: Logout from GitHub Container Registry
        run: docker logout cr.haust.app
        
      - name: Mint haust-infra token
        id: infra-token
        uses: actions/create-github-app-token@v3
        with:
          # client id is a public identifier, not a secret (same app as wallet-backend)
          client-id: Iv23lipOnRLr9kmJtlhH
          private-key: ${{ secrets.INFRA_BOT_PRIVATE_KEY }}
          owner: Haust-Labs
          repositories: haust-infra
          permission-contents: write

      - name: Checkout haust-infra repository
        uses: actions/checkout@v2
        with:
          repository: Haust-Labs/haust-infra
          token: ${{ steps.infra-token.outputs.token }}
          path: haust-infra
          ref: master
            
      - name: Update image tag in dev-values.yaml
        run: |
          ls
          echo "--------------infra--------------------"
          cd haust-infra
          ls

          NEW_TAG="${{ env.DATE }}"
          if [[ -z "$NEW_TAG" ]]; then
            echo "Ошибка: тег пустой!"
            exit 1
          fi

          echo "--------------echotag--------------------"
          echo $NEW_TAG

          if ! command -v yq &> /dev/null; then
            echo "Installing yq..."
            sudo apt-get update && sudo apt-get install -y jq
            sudo wget https://github.com/mikefarah/yq/releases/download/v4.17.1/yq_linux_amd64 -O /usr/local/bin/yq
            sudo chmod +x /usr/local/bin/yq
          fi

          # Обновляем тег в файле values-dev.yaml
          yq eval ".image.tag = \"$NEW_TAG\"" -i k8s/apps/scw/dex/dex-frontend/values-dev.yaml

          # Показываем результат
          echo "--------------tag--------------------"
          cat k8s/apps/scw/dex/dex-frontend/values-dev.yaml

      - name: Commit and push changes
        run: |
          cd haust-infra
          ls
          pwd
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add k8s/apps/scw/dex/dex-frontend/values-dev.yaml
          git commit -m "Update Dex FE version to ${{ github.ref_name }}"
          git push
