name: Build and Push Docker Image prod 

on:
  push:
    tags:
      - "release-v*"

jobs:
  build:
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: "h-master"

      - name: Log in to Nexus Artifact Repository
        uses: docker/login-action@v2
        with:
          registry: cr.haust.app
          username: ${{ secrets.NEXUS_USER}}
          password: ${{ secrets.NEXUS_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Convert repository owner and name to lowercase
        id: vars
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
         docker build --build-arg GITHUB_TOKEN=${{ secrets.TOKEN }} -t cr.haust.app/dex/dex:${{ github.ref_name }} .

      - name: Push Docker image to GHCR
        run: |
          docker push cr.haust.app/dex/dex:${{ github.ref_name }}
            
      - name: Logout from GitHub Container Registry
        run: docker logout cr.haust.app
        
